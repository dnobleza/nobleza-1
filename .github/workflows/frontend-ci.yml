name: Frontend CI

# When does this workflow run?
# On pushes and pull requests to develop/master, but only if a frontend file
# (or this workflow file itself) changed. Backend-only changes skip it.
on:
  push:
    branches: [develop, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  check:
    # The job runs on a fresh Ubuntu virtual machine from GitHub.
    runs-on: ubuntu-latest
    # Every "run:" step below starts inside the frontend/ folder.
    defaults:
      run:
        working-directory: frontend

    steps:
      # Download the repo code onto the machine.
      - name: Get the code
        uses: actions/checkout@v4

      # Install Node.js (same version as the backend) and cache npm downloads
      # so later runs are faster. The cache key comes from the lock file.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Clean install of the exact versions in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # ESLint checks the code for mistakes and style problems.
      - name: Lint
        run: npm run lint

      # Vite builds the production bundle. frontend/.env is gitignored, so CI
      # needs its own value for the one env var the app uses.
      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: Codehaus
