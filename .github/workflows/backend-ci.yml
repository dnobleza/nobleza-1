name: Backend CI

on:
  push:
    branches: [develop, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/codehaus_test
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/codehaus_test
      # Dummy value, only for CI. Not a real secret.
      JWT_SECRET: ci-dummy-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: codehaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d codehaus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # In CI, DATABASE_URL points at codehaus_test. npm test's "pretest" step also runs
      # migrations, so this step is a repeat (it just says "No migrations to run!").
      - name: Run migrations
        run: npm run migrate:up

      - name: Run tests
        run: npm test

      - name: Start server and check /health
        run: |
          npm start &
          sleep 3
          curl --fail http://localhost:3000/health
